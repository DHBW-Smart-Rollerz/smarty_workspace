# Copy to .github/workflows/trigger-ros-graph.yaml of every repository listed in
# config.yaml. Adjust the branch if config.yaml analyzes another one.
name: Trigger ROS Graph

on:
  push:
    branches: [jazzy]

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
    - name: 🕸️ Trigger ROS graph update
      env:
        GH_TOKEN: ${{ secrets.ROS_GRAPH_TOKEN }}
      run: |
        gh api repos/DHBW-Smart-Rollerz/smarty_workspace/dispatches \
          -f event_type=ros-graph \
          -f "client_payload[repo]=${{ github.event.repository.name }}"
